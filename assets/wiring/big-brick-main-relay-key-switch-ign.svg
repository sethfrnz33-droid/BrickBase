<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1130" viewBox="0 0 1680 1130" role="img" aria-labelledby="title desc">
<title id="title">Big Brick ECU main relay and ignition key wiring</title>
<desc id="desc">ACC or maintained wake output reaches ECU KEY cavity 4. IGN/RUN key output feeds main relay coil 86, and relay coil 85 returns to ECU L5 cavity 109. START is a separate starter request and does not feed the main relay. Battery positive through a fuse feeds relay contact 30, switched contact 87 feeds separately protected ECU VIN cavity 5 and engine load branches. Power grounds are cavities 1 through 3. No analog run-sense input is used.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#061422"/><stop offset="1" stop-color="#081723"/></linearGradient>
 <style>
 .head{font-family:Arial,Helvetica,sans-serif;font-weight:800;fill:#eff7fc}
 .sub{font-family:Arial,Helvetica,sans-serif;font-weight:600;fill:#a5c3d6}
 .label{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#eaf4f8}
 .small{font-family:Arial,Helvetica,sans-serif;font-weight:500;fill:#a7bfcc}
 .mono{font-family:Consolas,monospace;font-weight:700;fill:#e9f4fb}
 .dark{fill:#0a1a27;stroke:#39566a;stroke-width:2}
 .board{fill:#07121c;stroke:#4c7186;stroke-width:2.5}
 .wire{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
 .port{fill:#071520;stroke-width:3.5}
 </style>
</defs>
<rect width="1680" height="1130" fill="url(#bg)"/>
<rect x="0" y="0" width="1680" height="125" fill="#071523"/>
<rect x="44" y="21" width="8" height="78" rx="4" fill="#32d4f5"/>
<text x="82" y="70" class="head" font-size="49">MAIN RELAY + IGNITION KEY</text>
<text x="84" y="104" class="sub" font-size="21">BIG BRICK ECU · IGN/RUN FEEDS THE RELAY COIL · START IS SEPARATE</text>
<rect x="46" y="150" width="1588" height="451" rx="11" class="dark"/>
<text x="80" y="192" class="head" font-size="26">1 · KEY SWITCH + RELAY COIL</text>
<text x="80" y="216" class="small" font-size="16">The ECU controls the relay coil's ground side; the key's IGN contact supplies the positive side.</text>
<!-- The key switch is a functional diagram, not the actual vehicle's plug contact arrangement. -->
<rect x="106" y="249" width="424" height="297" rx="13" class="board"/>
<text x="135" y="286" class="head" font-size="27">IGNITION SWITCH</text>
<text x="136" y="310" class="small" font-size="16">Vehicle contacts · identify by function</text>
<rect x="136" y="324" width="207" height="31" rx="5" fill="#1b2d3b"/>
<text x="151" y="346" class="mono" font-size="16">FUSED BAT +12 V IN</text>
<text x="135" y="377" class="label" font-size="19">ACC / WAKE</text>
<text x="135" y="443" class="label" font-size="19">IGN / RUN</text>
<text x="135" y="509" class="label" font-size="19">START</text>
<circle cx="530" cy="366" r="10" class="port" stroke="#55c8f1"/>
<circle cx="530" cy="434" r="10" class="port" stroke="#ffbd63"/>
<circle cx="530" cy="498" r="10" class="port" stroke="#8795a2"/>
<!-- ACC/wake net: far above relay, then across to ECU KEY. -->
<path d="M530 366 H602 V321 H1265" class="wire" stroke="#55c8f1"/>
<text x="760" y="310" class="sub" font-size="18" fill="#55c8f1">WAKE TO ECU KEY / PIN 4</text>
<circle cx="1265" cy="321" r="9" class="port" stroke="#55c8f1"/>
<!-- IGN net to coil terminal 86. -->
<path d="M530 434 H749" class="wire" stroke="#ffbd63"/>
<text x="573" y="422" class="mono" font-size="17">IGN +12 V</text>
<!-- Relay coil as its own two-terminal object -->
<rect x="748" y="395" width="300" height="81" rx="12" fill="#0c2231" stroke="#ffbd63" stroke-width="2.5"/>
<text x="783" y="418" class="small" font-size="15">MAIN RELAY COIL</text>
<text x="774" y="450" class="mono" font-size="20">86 (+)</text>
<path d="M859 435 h21 l11 -12 l12 24 l12 -24 l12 24 l11 -12 h20" fill="none" stroke="#ffbd63" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M749 435 H859 M958 435 H1048" fill="none" stroke="#ffbd63" stroke-width="4" stroke-linecap="round"/>
<text x="960" y="450" class="mono" font-size="20">85 (−)</text>
<circle cx="749" cy="434" r="8" class="port" stroke="#ffbd63"/>
<circle cx="1048" cy="434" r="8" class="port" stroke="#99e6a0"/>
<!-- coil return to ECU L5 -->
<path d="M1048 434 H1265" class="wire" stroke="#99e6a0"/>
<text x="1088" y="423" class="sub" font-size="16">LOW-SIDE</text>
<circle cx="1265" cy="434" r="9" class="port" stroke="#99e6a0"/>
<!-- START output to distinct starter request, not relay. -->
<path d="M530 498 H615 V547 H755" fill="none" stroke="#7f99aa" stroke-width="6" stroke-dasharray="15 9" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="755" y="519" width="341" height="55" rx="7" fill="#122532" stroke="#577187" stroke-width="2"/>
<text x="771" y="541" class="mono" font-size="16">STARTER REQUEST ONLY</text>
<text x="771" y="560" class="small" font-size="14">NOT CONNECTED TO RELAY COIL</text>
<!-- ECU top card -->
<rect x="1265" y="246" width="321" height="308" rx="13" class="board"/>
<text x="1300" y="280" class="head" font-size="25">BIG BRICK ECU</text>
<text x="1300" y="304" class="small" font-size="15">Actual ECU cavity numbers</text>
<rect x="1294" y="311" width="263" height="34" rx="5" fill="#103447"/>
<text x="1315" y="334" class="mono" font-size="19">4   KEY / WAKE</text>
<rect x="1294" y="415" width="263" height="37" rx="5" fill="#173728"/>
<text x="1315" y="440" class="mono" font-size="19">109 L5 / RELAY −</text>
<rect x="1294" y="486" width="263" height="37" rx="5" fill="#152330"/>
<text x="1315" y="511" class="mono" font-size="18">1–3 POWER GND</text>
<path d="M1265 504 H1200 V543" class="wire" stroke="#a5b9c5"/>
<path d="M1176 543 H1224 M1183 550 H1217 M1191 558 H1209" fill="none" stroke="#a5b9c5" stroke-width="4" stroke-linecap="round"/>
<text x="1100" y="577" class="small" font-size="15">To engine / battery ground</text>
<text x="88" y="588" class="sub" font-size="16">IGN MUST REMAIN POWERED DURING START. VERIFY THE KEY'S ACTUAL CONTACT BEHAVIOR.</text>
<!-- relay contact switched power separate from the control coil -->
<rect x="46" y="623" width="1588" height="385" rx="11" class="dark"/>
<text x="80" y="665" class="head" font-size="26">2 · RELAY CONTACTS + FUSED OUTPUTS</text>
<text x="80" y="689" class="small" font-size="16">Relay contacts are physically separate from the coil, and supply ECU VIN plus engine loads.</text>
<rect x="94" y="748" width="231" height="61" rx="9" fill="#142331" stroke="#ff687b" stroke-width="2"/>
<text x="113" y="776" class="mono" font-size="18">BATTERY +12 V</text>
<text x="113" y="797" class="small" font-size="14">Vehicle supply</text>
<path d="M325 779 H392" class="wire" stroke="#ff687b"/>
<rect x="392" y="753" width="152" height="52" rx="6" fill="#261a28" stroke="#ff687b" stroke-width="2"/>
<text x="423" y="783" class="mono" font-size="17">MAIN FUSE</text>
<path d="M544 779 H717" class="wire" stroke="#ff687b"/>
<rect x="717" y="723" width="331" height="116" rx="10" fill="#102332" stroke="#577a90" stroke-width="2.5"/>
<text x="753" y="749" class="head" font-size="20">MAIN RELAY CONTACT</text>
<text x="748" y="795" class="mono" font-size="22">30</text>
<path d="M717 779 H800 M984 779 H1048" fill="none" stroke="#ff687b" stroke-width="6" stroke-linecap="round"/>
<path d="M800 780 H841 L882 763 M882 780 H984" fill="none" stroke="#ff687b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="982" y="795" class="mono" font-size="22">87</text>
<path d="M1048 779 H1120 V729 H1173" class="wire" stroke="#ff687b"/>
<circle cx="1120" cy="779" r="9" fill="#ff687b" stroke="#ffe3e5" stroke-width="2"/>
<path d="M1120 779 V890 H1173" class="wire" stroke="#ff687b"/>
<rect x="1173" y="704" width="134" height="50" rx="6" fill="#261a28" stroke="#ff687b" stroke-width="2"/>
<text x="1209" y="735" class="mono" font-size="18">FUSE A</text>
<path d="M1307 729 H1341" class="wire" stroke="#ff687b"/>
<rect x="1341" y="690" width="248" height="79" rx="9" fill="#133044" stroke="#55c8f1" stroke-width="2"/>
<text x="1360" y="722" class="head" font-size="22">ECU VIN / PIN 5</text>
<text x="1360" y="745" class="small" font-size="15">Main ECU power</text>
<rect x="1173" y="864" width="134" height="50" rx="6" fill="#261a28" stroke="#ff687b" stroke-width="2"/>
<text x="1209" y="895" class="mono" font-size="18">FUSE B</text>
<path d="M1307 889 H1341" class="wire" stroke="#ff687b"/>
<rect x="1341" y="844" width="248" height="88" rx="9" fill="#142b37" stroke="#ff687b" stroke-width="2"/>
<text x="1360" y="876" class="head" font-size="20">ENGINE LOADS</text>
<text x="1360" y="900" class="small" font-size="15">Injectors / coils etc.</text>
<text x="92" y="959" class="sub" font-size="18">CONTACT 30 = FUSED BATTERY. CONTACT 87 = SWITCHED SUPPLY. LOAD BRANCHES HAVE THEIR OWN FUSES.</text>
<!-- final compact interpretation -->
<rect x="46" y="1024" width="1588" height="83" rx="9" fill="#0e2733" stroke="#3c687c" stroke-width="2"/>
<text x="78" y="1059" class="head" font-size="21">IGN OFF → COIL LOSES POWER → RELAY OPENS → VIN + ENGINE LOAD POWER TURN OFF.</text>
<text x="78" y="1087" class="sub" font-size="18">No AV input is required to command engine shutdown in this main-relay example. Actual key/relay connector terminals vary by vehicle.</text>
</svg>